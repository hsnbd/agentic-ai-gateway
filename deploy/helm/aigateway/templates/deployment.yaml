apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "aigateway.fullname" . }}
  labels: {{- include "aigateway.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector: {matchLabels: {app.kubernetes.io/name: {{ include "aigateway.name" . }}, app.kubernetes.io/instance: {{ .Release.Name }}}}
  template:
    metadata:
      labels: {app.kubernetes.io/name: {{ include "aigateway.name" . }}, app.kubernetes.io/instance: {{ .Release.Name }}}
      {{- with .Values.podAnnotations }}
      annotations: {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      serviceAccountName: {{ include "aigateway.serviceAccountName" . }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets: {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- if .Values.migrations.enabled }}
      # Apply Alembic migrations before any gateway container starts. With
      # several replicas the init containers race harmlessly: Alembic takes a
      # lock on its version table, and later runs find nothing to do.
      initContainers:
        - name: migrate
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["python", "-m", "app.cli", "migrate"]
          env: {{- include "aigateway.env" . | nindent 12 }}
      {{- end }}
      containers:
        - name: gateway
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports: [{name: http, containerPort: 8000, protocol: TCP}]
          env: {{- include "aigateway.env" . | nindent 12 }}
          volumeMounts: [{name: config, mountPath: /app/config, readOnly: true}]
          resources: {{- toYaml .Values.resources | nindent 12 }}
          startupProbe:
            httpGet: {path: /healthz, port: http}
            failureThreshold: 30
            periodSeconds: 5
          livenessProbe:
            httpGet: {path: /healthz, port: http}
            periodSeconds: 10
          readinessProbe:
            httpGet: {path: /readyz, port: http}
            periodSeconds: 10
            failureThreshold: 6
      volumes: [{name: config, configMap: {name: {{ include "aigateway.fullname" . }}-config}}]
