{{- if .Values.autoscaling.enabled }}
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: {{ include "aigateway.fullname" . }}
  labels: {{- include "aigateway.labels" . | nindent 4 }}
spec:
  scaleTargetRef: {apiVersion: apps/v1, kind: Deployment, name: {{ include "aigateway.fullname" . }}}
  minReplicas: {{ .Values.autoscaling.minReplicas }}
  maxReplicas: {{ .Values.autoscaling.maxReplicas }}
  metrics:
    - type: Resource
      resource: {name: cpu, target: {type: Utilization, averageUtilization: {{ .Values.autoscaling.targetCPUUtilizationPercentage }}}}
    {{- if .Values.autoscaling.targetRequestsPerSecond }}
    - type: Pods
      pods: {metric: {name: gateway_requests_per_second}, target: {type: AverageValue, averageValue: {{ .Values.autoscaling.targetRequestsPerSecond | quote }}}}
    {{- end }}
{{- end }}
