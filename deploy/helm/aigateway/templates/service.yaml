apiVersion: v1
kind: Service
metadata:
  name: {{ include "aigateway.fullname" . }}
  labels: {{- include "aigateway.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  selector: {app.kubernetes.io/name: {{ include "aigateway.name" . }}, app.kubernetes.io/instance: {{ .Release.Name }}}
  ports: [{name: http, port: {{ .Values.service.port }}, targetPort: http, protocol: TCP}]
