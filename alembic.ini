# Alembic configuration. The database URL comes from the gateway's own
# settings (DATABASE_URL), not from this file; see app/db/migrations/env.py.
#
#   uv run aigateway migrate          # upgrade to the latest revision
#   uv run aigateway db-stamp         # adopt a schema made by AUTO_CREATE_SCHEMA
#   uv run alembic revision --autogenerate -m "describe the change"

[alembic]
script_location = app/db/migrations
prepend_sys_path = .
file_template = %%(rev)s_%%(slug)s

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
